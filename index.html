<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker Kuliah v2 · REST API</title>
  <link rel="stylesheet" href="style.css">
  <script src="mock-api.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="app-header">
      <div class="header-title">
        <h1>📋 Task Tracker Kuliah <span class="badge-version">v2 · REST API</span></h1>
      </div>
      <div class="network-bar">
        <label for="network-mode" class="sr-only">Mode Jaringan</label>
        <select id="network-mode" class="network-select" title="Simulasi Kondisi Jaringan">
          <option value="normal">Normal</option>
          <option value="lambat">Lambat</option>
          <option value="offline">Offline</option>
        </select>
        <button type="button" id="btn-reload" class="btn-reload" title="Muat ulang dari server">↻</button>
      </div>
    </header>

    <form id="task-form" class="task-form" novalidate>
      <div class="form-row">
        <input
          type="text"
          id="input-judul"
          class="input-control"
          placeholder="Judul tugas (min. 3 karakter)"
          autocomplete="off"
        >
      </div>

      <div class="form-row form-inline">
        <select id="input-matkul" class="input-control select-matkul">
          <option value="">Memuat mata kuliah...</option>
        </select>

        <input
          type="date"
          id="input-deadline"
          class="input-control input-date"
        >

        <button type="submit" id="btn-submit" class="btn-submit">Tambah</button>
      </div>

      <p id="error-msg" class="error-msg" hidden></p>
    </form>

    <div class="search-row">
      <input
        type="search"
        id="input-search"
        class="input-control input-search"
        placeholder="Cari judul tugas atau mata kuliah..."
        autocomplete="off"
      >
    </div>

    <div class="toolbar">
      <div id="filter-group" class="filter-group">
        <button type="button" class="filter-btn on" data-filter="semua">Semua</button>
        <button type="button" class="filter-btn" data-filter="aktif">Aktif</button>
        <button type="button" class="filter-btn" data-filter="selesai">Selesai</button>
      </div>
      <span id="task-counter" class="task-counter">0 tugas aktif</span>
    </div>

    <div id="state-box" class="state-box" hidden></div>
    <ul id="task-list" class="task-list"></ul>
    <p id="empty-msg" class="empty-msg" hidden>Tidak ada tugas untuk ditampilkan.</p>
  </main>
</body>
</html>
